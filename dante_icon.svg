<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a2010"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFD700"/>
      <stop offset="40%"  stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFD700" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#B8860B" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 배경 원 -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>

  <!-- 외곽 링 -->
  <circle cx="256" cy="256" r="245" fill="none" stroke="url(#ringGrad)" stroke-width="3"/>

  <!-- 내부 장식 링 -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#FFD700" stroke-width="0.8" stroke-opacity="0.2"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#FFD700" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- 코인 몸체 -->
  <circle cx="256" cy="256" r="185" fill="#1a1400" stroke="#FFD700" stroke-width="2" stroke-opacity="0.5"/>

  <!-- D 글자 (메인) -->
  <text x="256" y="330"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="230"
        font-weight="bold"
        text-anchor="middle"
        fill="url(#goldGrad)"
        filter="url(#softGlow)">D</text>

  <!-- 하단 텍스트 -->
  <text x="256" y="430"
        font-family="Arial, sans-serif"
        font-size="36"
        font-weight="bold"
        letter-spacing="10"
        text-anchor="middle"
        fill="#FFD700"
        fill-opacity="0.85">DNT</text>

  <!-- 상단 장식 점들 -->
  <circle cx="256" cy="68"  r="4" fill="#FFD700" opacity="0.6"/>
  <circle cx="226" cy="74"  r="2.5" fill="#FFD700" opacity="0.4"/>
  <circle cx="286" cy="74"  r="2.5" fill="#FFD700" opacity="0.4"/>

  <!-- 좌우 장식 다이아 -->
  <polygon points="44,256 56,244 68,256 56,268" fill="#FFD700" opacity="0.5"/>
  <polygon points="444,256 456,244 468,256 456,268" fill="#FFD700" opacity="0.5"/>
</svg>
